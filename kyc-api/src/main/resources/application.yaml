app:
  datasource:
    primary:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/kyc_db}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:sidemenxix}
      driver-class-name: org.postgresql.Driver
    audit:
      url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/kyc_audit_db}
      username: ${AUDIT_DB_USERNAME:postgres}
      password: ${AUDIT_DB_PASSWORD:sidemenxix}
      driver-class-name: org.postgresql.Driver

server:
  port: 8081

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/kyc-realm

# ✅ MUST be at root level (same indentation as spring/server/app)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  verify:
    service-sid: ${TWILIO_VERIFY_SERVICE_SID}
